name: Deploy AECHI to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  SAM_STACK_NAME: aechi-prod

jobs:
  # ─────────────────────────────
  # Job 1: Test Edge Node & Lambdas
  # ─────────────────────────────
  test-suite:
    name: Run Unit Tests (Edge & Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r edge_node/requirements.txt
          pip install -r cloud_backend/requirements.txt
          pip install pytest

      - name: Run Edge Node Unit Tests
        run: |
          cd edge_node
          python -m unittest discover tests -v

      - name: Run Cloud Backend Unit Tests
        run: |
          cd cloud_backend
          python -m unittest discover tests -v

  # ─────────────────────────────
  # Job 2: Deploy AWS SAM Backend
  # ─────────────────────────────
  deploy-backend:
    name: Deploy Serverless Backend
    runs-on: ubuntu-latest
    needs: test-suite
    if: github.repository_owner == 'tejasvigautam2007'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        if: steps.aws-creds.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AWS SAM CLI
        if: steps.aws-creds.outcome == 'success'
        run: pip install aws-sam-cli

      - name: SAM Build
        if: steps.aws-creds.outcome == 'success'
        run: |
          cd cloud_backend/api
          sam build --use-container

      - name: SAM Deploy
        if: steps.aws-creds.outcome == 'success'
        run: |
          cd cloud_backend/api
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides Stage=prod AlertEmail="${{ secrets.ALERT_EMAIL || '' }}" WebhookUrl="${{ secrets.WEBHOOK_URL || '' }}"

      - name: Get API endpoint
        if: steps.aws-creds.outcome == 'success'
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          echo "API_ENDPOINT=$API_URL" >> $GITHUB_ENV
          echo "✅ Deployed API: $API_URL"

  # ─────────────────────────────
  # Job 3: Build & Deploy Dashboard
  # ─────────────────────────────
  deploy-dashboard:
    name: Build & Verify Dashboard
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        run: |
          cd dashboard
          npm install

      - name: Build dashboard
        run: |
          cd dashboard
          npm run build

      - name: Verification status
        run: echo "Dashboard build succeeded. Connect repository to AWS Amplify for continuous hosting."
